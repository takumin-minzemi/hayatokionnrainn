<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一人一台！オンライン計算早解きバトル</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      background-color: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }

    h1 { font-size: 1.5rem; margin-bottom: 20px; color: #f43f5e; }

    /* 待機・ロビー画面 */
    .lobby-box { display: flex; flex-direction: column; gap: 12px; }
    input[type="text"] {
      padding: 12px;
      font-size: 1.2rem;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #0f172a;
      color: #fff;
      text-align: center;
      text-transform: uppercase;
    }
    button {
      padding: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #f43f5e;
      color: white;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    button.secondary { background: #3b82f6; }

    /* 対戦画面 */
    #game-area { display: none; }
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 20px;
      font-size: 1.1rem;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
    }
    .question { font-size: 2.5rem; font-weight: 800; margin: 20px 0; color: #38bdf8; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-option {
      background: #334155;
      border: 2px solid #475569;
      color: #fff;
      font-size: 1.5rem;
      font-weight: bold;
      padding: 16px;
      border-radius: 12px;
    }

    .room-code-display {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 4px;
      color: #38bdf8;
      margin: 10px 0;
    }
  </style>

  <!-- Firebase リアルタイム通信用のライブラリを読み込み -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="container">
    <h1>計算早解きバトル (Online)</h1>

    <!-- 1. 接続・部屋選択画面 -->
    <div id="lobby-area" class="lobby-box">
      <button onclick="createRoom()">部屋を作る（ホスト）</button>
      <div style="margin: 10px 0; color: #64748b;">または</div>
      <input type="text" id="room-input" placeholder="4桁の部屋コード" maxlength="4">
      <button class="secondary" onclick="joinRoom()">部屋に入る</button>
    </div>

    <!-- 2. 部屋待機画面 -->
    <div id="wait-area" style="display:none;">
      <p>相手の参加を待っています...</p>
      <div class="room-code-display" id="display-room-code">----</div>
      <p style="font-size:0.9rem; color:#94a3b8;">相手にこのコードを教えてください</p>
    </div>

    <!-- 3. ゲーム対戦画面 -->
    <div id="game-area">
      <div class="status-bar">
        <div>自分: <span id="my-score">0</span></div>
        <div>相手: <span id="opp-score">0</span></div>
      </div>
      <div class="question" id="question-text">? + ?</div>
      <div class="options-grid" id="options-container"></div>
    </div>
  </div>

  <script>
    // 無料の公開Firebase環境設定（デモ用）
    const firebaseConfig = {
      databaseURL: "https://hayatokionnrainn-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let roomId = "";
    let playerRole = ""; // 'host' または 'guest'
    let roomRef = null;
    let currentAnswer = 0;

    // 部屋作成
    function createRoom() {
      roomId = Math.floor(1000 + Math.random() * 9000).toString();
      playerRole = 'host';
      roomRef = db.ref('rooms/' + roomId);

      // 初期データ書き込み
      roomRef.set({
        status: 'waiting',
        scores: { host: 0, guest: 0 },
        question: generateQuestionData()
      });

      // 部屋削除の自動クリーンアップ（接続終了時）
      roomRef.onDisconnect().remove();

      document.getElementById('lobby-area').style.display = 'none';
      document.getElementById('wait-area').style.display = 'block';
      document.getElementById('display-room-code').textContent = roomId;

      listenToRoom();
    }

    // 部屋参加
    function joinRoom() {
      const input = document.getElementById('room-input').value.trim();
      if (input.length !== 4) return alert('4桁のコードを入力してください');

      roomId = input;
      playerRole = 'guest';
      roomRef = db.ref('rooms/' + roomId);

      roomRef.once('value', (snapshot) => {
        if (!snapshot.exists()) {
          alert('部屋が見つかりません');
          return;
        }
        // 参加処理
        roomRef.update({ status: 'playing' });
        document.getElementById('lobby-area').style.display = 'none';
        document.getElementById('game-area').style.display = 'block';
        listenToRoom();
      });
    }

    // 問題データの生成（ホスト側で計算）
    function generateQuestionData() {
      const ops = ['+', '-', '×'];
      const op = ops[Math.floor(Math.random() * ops.length)];
      let n1, n2, ans;

      if (op === '+') { n1 = rand(1,20); n2 = rand(1,20); ans = n1 + n2; }
      else if (op === '-') { n1 = rand(5,25); n2 = rand(1,n1); ans = n1 - n2; }
      else { n1 = rand(2,9); n2 = rand(2,9); ans = n1 * n2; }

      const options = new Set([ans]);
      while (options.size < 4) {
        let dummy = ans + rand(-5, 5);
        if (dummy >= 0 && dummy !== ans) options.add(dummy);
      }

      return {
        text: `${n1} ${op} ${n2}`,
        answer: ans,
        options: Array.from(options).sort(() => Math.random() - 0.5)
      };
    }

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    // 通信データの監視
    function listenToRoom() {
      roomRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        // ゲーム開始検知
        if (data.status === 'playing') {
          document.getElementById('wait-area').style.display = 'none';
          document.getElementById('game-area').style.display = 'block';
        }

        // スコア更新
        const myScore = playerRole === 'host' ? data.scores.host : data.scores.guest;
        const oppScore = playerRole === 'host' ? data.scores.guest : data.scores.host;
        document.getElementById('my-score').textContent = myScore;
        document.getElementById('opp-score').textContent = oppScore;

        // 勝利判定 (10点先取)
        if (myScore >= 10) {
          alert('あなたの勝利です！🎉');
          location.reload();
        } else if (oppScore >= 10) {
          alert('相手の勝利です...どんまい！');
          location.reload();
        }

        // 問題更新
        if (data.question) {
          currentAnswer = data.question.answer;
          document.getElementById('question-text').textContent = data.question.text;
          renderOptions(data.question.options);
        }
      });
    }

    // 選択肢の描画
    function renderOptions(options) {
      const container = document.getElementById('options-container');
      container.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.textContent = opt;
        btn.onclick = () => selectOption(opt);
        container.appendChild(btn);
      });
    }

    // 解答をタップした時
    function selectOption(selected) {
      if (selected === currentAnswer) {
        // 正解したら自分に+1点し、新しい問題をセットする
        roomRef.transaction((data) => {
          if (data) {
            if (playerRole === 'host') data.scores.host++;
            else data.scores.guest++;
            data.question = generateQuestionData();
          }
          return data;
        });
      }
    }
  </script>
</body>
</html>
